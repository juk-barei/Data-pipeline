services:
  pipeline:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      CSV_DIR: /app/data
    volumes:
      - ../data:/app/data
      - ../rclone-config:/root/.config/rclone:ro
    restart: on-failure
    stop_signal: SIGINT
    stop_grace_period: 120s
