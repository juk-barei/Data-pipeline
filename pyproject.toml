[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tron-data-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0,<2", "httpx[http2]>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
parquet = ["pyarrow>=14"]
analysis = ["pandas>=2,<4", "networkx>=3,<4", "pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
